name: Maven CI/CD

on:
  push:
    branches: [master, feature-actions]
    
  pull_request:
    branches: [master, feature-actions]

jobs:
 build_and_test:

  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Build project with Maven
      run: cd roman-number mvn -B package --file pom.xml
      
