name: Maven CI/CD

on:
  push:
    branches: [master, feature-actions]
    
  pull_request:
    branches: [master, feature-actions]

jobs:
 build_and_test:

  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: 26
    - name: Build project with Maven
      run: mvn -B package --file pom.xml
      
